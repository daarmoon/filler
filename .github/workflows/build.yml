# 윈도우 설치 파일 자동 빌드: Releases에서 새 릴리스(예: 태그 v6.0.0)를 발행하면 설치 파일이 그 릴리스에 붙어요.
# Actions 탭에서 "Run workflow"로 직접 돌리면 결과 파일을 Artifacts로 받을 수 있어요.
name: Windows 빌드
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 트렌드 노트 받기 (있으면 빌드에 넣어 둠)
        shell: bash
        run: |
          mkdir -p trends
          if git fetch --depth=1 origin trends; then git show FETCH_HEAD:notes.json > trends/notes.json || rm -f trends/notes.json; fi
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: FillerMakers-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
      - name: 릴리스에 올리기 (릴리스를 발행했을 때만)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
